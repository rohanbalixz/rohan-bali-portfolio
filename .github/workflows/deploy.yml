name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Add .nojekyll
        run: touch ./out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # While the repo's Pages source is "Deploy from a branch", GitHub also runs
  # its built-in Jekyll deploy ("pages build and deployment") on every push,
  # which publishes the bare repo. Whichever deploy finishes last is served.
  # This job waits for that run to finish so the built site is deployed after
  # it. It is a separate job, without the github-pages environment, so it does
  # not hold the Pages deployment slot that the built-in deploy needs. If no
  # such run appears within a minute (source set to GitHub Actions), it ends.
  wait-for-branch-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the built-in branch deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            state=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=20" \
              | jq -r '[.workflow_runs[] | select(.name == "pages build and deployment")]
                       | if length == 0 then "none"
                         elif all(.status == "completed") then "done"
                         else "running" end')
            echo "built-in deploy: $state"
            if [ "$state" = "done" ]; then exit 0; fi
            if [ "$state" = "none" ] && [ "$i" -ge 6 ]; then exit 0; fi
            sleep 10
          done
          echo "Timed out waiting; deploying anyway."

  deploy:
    needs: [build, wait-for-branch-deploy]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
